# =====================================================================
#  docker-compose.yml
#  Starts the ENTIRE Agentic-RAG app (backend + frontend) with ONE command.
#
#  This replaces the two commands you were running manually:
#      uvicorn main_rag:app --reload      ->  backend (port 8000)
#      npm run dev                        ->  frontend (port 5173)
# =====================================================================
#
#  HOW TO USE - exact sequential commands (for reference only):
#  ----------------------------------------------------------------
#    1) Build the images (first time, or after changing Dockerfiles):
#           docker compose build
#
#    2) Start the whole system (THE one-command solution):
#           docker compose up -d
#
#    3) Watch the logs of both services:
#           docker compose logs -f
#
#    4) Stop everything when done:
#           docker compose down
#
#    Manual fallback (if you prefer to build/run containers by hand):
#           docker build -t rag-backend -f Dockerfile.backend backend
#           docker run -d -p 8000:8000 --env-file backend/.env -v ${PWD}/backend:/app rag-backend
#           docker build -t rag-frontend frontend-rag/react
#           docker run -d -p 5173:5173 rag-frontend
#
#  NOTE on Redis / Ollama: the app code currently does NOT connect to
#  them, but if you enable them later, add `redis` / `ollama` services
#  here and point the backend at them (instead of "localhost").
# =====================================================================

services:

  # ----------------------------------------------------------------
  # BACKEND  (FastAPI + uvicorn, port 8000)
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: rag-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      # Bind-mount only the backend app so code edits hot-reload
      # (uvicorn --reload) and backend data persists on the host.
      - ./backend:/app
    # Same command you used to run manually, now inside the container.
    # (also defined as CMD in Dockerfile.backend)
    command: ["uvicorn", "main_rag:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  # ----------------------------------------------------------------
  # FRONTEND  (React + Vite dev server, port 5173)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: frontend-rag/react
    container_name: rag-frontend
    expose:
      - "5173"
    volumes:
      # Bind-mount source so Vite hot-reloads your edits...
      - ./frontend-rag/react:/app
      # ...but keep the Linux node_modules built inside the image
      # (never use the Windows node_modules from the host).
      - /app/node_modules
    # Same as `npm run dev`, bound to 0.0.0.0 so the host browser can reach it.
    # (also defined as CMD in frontend-rag/react/Dockerfile)
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend
